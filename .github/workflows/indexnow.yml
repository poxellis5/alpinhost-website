name: IndexNow nach Deploy
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warten bis GitHub Pages neu gebaut ist
        run: sleep 120
      - name: Alle URLs aus der Sitemap an IndexNow melden
        run: |
          python3 - <<'PY' > payload.json
          import re, json
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          print(json.dumps({"host": "alpinhost.ch", "key": "ca09ed058b7cee21a9ddafbd89bae8b8",
                            "keyLocation": "https://alpinhost.ch/ca09ed058b7cee21a9ddafbd89bae8b8.txt", "urlList": urls}))
          PY
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @payload.json
